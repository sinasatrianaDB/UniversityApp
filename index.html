<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071326"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Uni Planner</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#071326;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 24px;border-radius:0 0 26px 26px}header small{color:#94a3b8;font-weight:800;letter-spacing:.13em}h1{font-size:26px;line-height:1.1;margin:16px 0 7px}header p{margin:0;color:#cbd5e1;font-size:12px}.wrap{padding:12px;max-width:720px;margin:auto}.summary{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:14px}.summary strong{display:block;font-size:14px}.summary span{display:block;color:#64748b;font-size:11px;margin-top:4px}.ring{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:conic-gradient(#0f172a var(--p),#e2e8f0 0);position:relative}.ring:after{content:'';position:absolute;inset:6px;background:#fff;border-radius:50%}.ring b{z-index:1;font-size:11px}.chips{display:flex;gap:8px;overflow:auto;margin:12px -12px;padding:0 12px 5px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #e2e8f0;background:#fff;border-radius:99px;padding:10px 13px;font-weight:700;color:#475569}.chip.on{background:#0f172a;color:#fff}.tools{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;background:#f1f5f9ee;backdrop-filter:blur(8px)}.tools input{width:100%;height:44px;border:1px solid #dbe2ea;border-radius:13px;padding:0 13px}.toolbtn{height:44px;border:1px solid #dbe2ea;background:#fff;border-radius:13px;padding:0 12px}.add{grid-column:1/-1;background:#0f172a;color:#fff;border:0;font-weight:800}.section{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 8px}.section h2{font-size:16px;margin:0}.section span{font-size:11px;color:#64748b}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:5px 34px 1fr auto;background:#fff;border:1px solid #e2e8f0;border-radius:15px;overflow:hidden}.stripe{height:100%}.check{width:30px;height:30px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;margin:12px 2px}.content{padding:11px 5px 11px 4px;min-width:0}.date{font-size:11px;color:#64748b;font-weight:700;margin-bottom:6px}.title{font-weight:750;line-height:1.35}.tag{font-size:9px;font-weight:800;background:#f1f5f9;border-radius:99px;padding:3px 7px;margin-left:5px}.course{font-size:11px;color:#64748b;margin-top:5px}.note{font-size:11px;color:#a16207;margin-top:6px}.actions{display:flex;flex-direction:column;gap:4px;padding:8px 7px}.iconbtn{border:0;background:#f8fafc;border-radius:9px;width:34px;height:34px}.done{opacity:.54}.done .check{background:#0f172a;border-color:#0f172a;color:#fff}.done .title{text-decoration:line-through}.warning{font-size:11px;line-height:1.45;color:#78350f;background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:12px;margin:14px 0 25px}.modal{position:fixed;inset:0;background:#020617aa;z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheethead h2{margin:0;font-size:20px}.close{border:0;background:#f1f5f9;border-radius:50%;width:38px;height:38px;font-size:20px}.form{display:grid;gap:12px}.field label{display:block;font-size:11px;font-weight:800;color:#475569;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px;background:#fff}.field textarea{min-height:76px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{border:0;background:#0f172a;color:#fff;border-radius:13px;padding:13px;font-weight:800}.cancel{border:1px solid #cbd5e1;background:#fff;border-radius:13px;padding:12px}@media(min-width:701px){header{max-width:720px;margin:20px auto 0;border-radius:26px}.wrap{padding-top:16px}.list{grid-template-columns:1fr 1fr}.modal{align-items:center;justify-content:center}.sheet{max-width:520px;border-radius:24px}}
</style></head><body><header><small>🎓 WINTER SEMESTER 2026/27</small><h1>University planner</h1><p>Assignments, presentations and exams in one place.</p></header><main class="wrap"><section class="summary"><div><strong id="nextTitle">Next deadline</strong><span id="nextMeta"></span></div><div class="ring" id="ring" style="--p:0%"><b id="pct">0%</b></div></section><nav class="chips" id="chips"></nav><div class="tools"><input id="q" placeholder="Search deadlines…" oninput="render()"><button class="toolbtn" id="hide" onclick="toggleHide()">Hide done</button><button class="toolbtn add" onclick="openForm()">＋ Add new event</button></div><div class="section"><h2 id="heading">All courses</h2><span id="count"></span></div><section class="list" id="list"></section><div class="warning"><b>⚠ Dates to confirm:</b> IT Management interim upload dates, allocation of the 12/19 January exams, and the exact Research Project exam date in Calendar Week 25.</div></main>
<div class="modal" id="modal" onclick="backdrop(event)"><section class="sheet"><div class="sheethead"><h2 id="formTitle">Add event</h2><button class="close" onclick="closeForm()">×</button></div><form class="form" onsubmit="saveEvent(event)"><input type="hidden" id="eventId"><div class="field"><label>Title</label><input id="eventTitle" required placeholder="Event title"></div><div class="field"><label>Course</label><input id="eventCourse" required list="courseList" placeholder="Course name"><datalist id="courseList"></datalist></div><div class="row"><div class="field"><label>Date</label><input id="eventDate" type="date" required></div><div class="field"><label>Type</label><select id="eventType"><option>Upload</option><option>Presentation</option><option>Exam</option><option>Check-in</option><option>Deliverable</option><option>Optional</option><option>Other</option></select></div></div><div class="field"><label>Display date text (optional)</label><input id="eventDisplay" placeholder="Example: 12 or 19 Jan 2027"></div><div class="field"><label>Notes (optional)</label><textarea id="eventNote" placeholder="Additional information"></textarea></div><button class="save">Save event</button><button type="button" class="cancel" onclick="closeForm()">Cancel</button></form></section></div>
<script>
const colors={"Domain Fundamentals":"#3b82f6","IT Management":"#8b5cf6","Leadership":"#f59e0b","Research Project":"#10b981"};const defaults=[[1,'Research Project','2026-10-21','21 Oct 2026','Competence Check-in 1 + team formation','Check-in',''],[2,'Domain Fundamentals','2026-10-23','23 Oct 2026','Upload 10 interview questions','Upload',''],[3,'Domain Fundamentals','2026-10-27','27 Oct 2026','Present the 2 best interview questions','Presentation',''],[4,'Research Project','2026-10-27','27 Oct 2026','Map of perspectives','Deliverable',''],[5,'IT Management','2026-11-03','3 Nov 2026','Interim Presentation 1','Optional','Upload date unclear.'],[6,'Research Project','2026-11-11','11 Nov 2026','Competence Check-in 2','Check-in',''],[7,'Research Project','2026-11-17','17 Nov 2026','Problem Framing Brief','Deliverable',''],[8,'IT Management','2026-12-01','1 Dec 2026','Interim Presentation 2','Optional','Upload date unclear.'],[9,'Leadership','2026-12-09','9 Dec 2026','Upload presentation + literature for both topics','Upload',''],[10,'Leadership','2026-12-10','10–11 Dec 2026','Presentation exam','Exam','Present 1 of the 2 selected topics.'],[11,'Research Project','2026-12-12','12 Dec 2026','Review Protocol','Deliverable',''],[12,'Research Project','2026-12-16','16 Dec 2026','Competence Check-in 3','Check-in',''],[13,'Domain Fundamentals','2027-01-07','7 Jan 2027','Upload final presentation','Upload',''],[14,'IT Management','2027-01-08','8 Jan 2027','Upload concept + artifact + presentation','Upload',''],[15,'Domain Fundamentals','2027-01-12','12 or 19 Jan 2027','Presentation exam','Exam','Exact date to be assigned.'],[16,'IT Management','2027-01-12','12 or 19 Jan 2027','Presentation exam','Exam','Exact date to be assigned.'],[17,'Research Project','2027-01-20','20 Jan 2027','Competence Check-in 4','Check-in',''],[18,'Research Project','2027-01-22','22 Jan 2027','Upload poster + paper','Upload',''],[19,'Research Project','2027-01-25','25 Jan 2027','Upload presentation','Upload',''],[20,'Research Project','2027-06-21','Calendar Week 25 · TBD','Presentation exam','Exam','Exact date not confirmed.']].map(x=>({id:x[0],course:x[1],date:x[2],display:x[3],title:x[4],type:x[5],note:x[6]}));let items=JSON.parse(localStorage.getItem('uniEvents')||'null')||defaults,selected='All courses',hide=false,done=JSON.parse(localStorage.getItem('uniDone')||'{}');const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),color=c=>colors[c]||'#64748b';function persist(){localStorage.setItem('uniEvents',JSON.stringify(items));localStorage.setItem('uniDone',JSON.stringify(done))}function select(x){selected=x;render()}function mark(id){done[id]=!done[id];persist();render()}function toggleHide(){hide=!hide;$('hide').textContent=hide?'Show done':'Hide done';render()}function openForm(id){let x=id?items.find(i=>i.id===id):null;$('formTitle').textContent=x?'Edit event':'Add event';$('eventId').value=x?.id||'';$('eventTitle').value=x?.title||'';$('eventCourse').value=x?.course||'';$('eventDate').value=x?.date||'';$('eventType').value=x?.type||'Deliverable';$('eventDisplay').value=x?.display||'';$('eventNote').value=x?.note||'';$('modal').classList.add('open')}function closeForm(){$('modal').classList.remove('open')}function backdrop(e){if(e.target===$('modal'))closeForm()}function saveEvent(e){e.preventDefault();let id=+$('eventId').value||Date.now(),course=$('eventCourse').value.trim();let event={id,course,date:$('eventDate').value,display:$('eventDisplay').value.trim()||fmt($('eventDate').value),title:$('eventTitle').value.trim(),type:$('eventType').value,note:$('eventNote').value.trim()};let n=items.findIndex(i=>i.id===id);if(n>=0)items[n]=event;else items.push(event);items.sort((a,b)=>a.date.localeCompare(b.date));persist();closeForm();render()}function removeEvent(id){if(!confirm('Delete this event?'))return;items=items.filter(i=>i.id!==id);delete done[id];persist();render()}function render(){let courses=[...new Set(items.map(i=>i.course))],q=$('q').value.toLowerCase();$('courseList').innerHTML=courses.map(x=>`<option value="${esc(x)}">`).join('');$('chips').innerHTML=['All courses',...courses].map(x=>`<button class="chip ${x===selected?'on':''}" onclick="select('${esc(x).replace(/'/g,'\\\'')}')">${esc(x)}</button>`).join('');let f=items.filter(x=>(selected==='All courses'||x.course===selected)&&(!hide||!done[x.id])&&(x.course+' '+x.title+' '+x.type+' '+x.note).toLowerCase().includes(q));$('heading').textContent=selected;$('count').textContent=f.length+' milestones';$('list').innerHTML=f.map(x=>`<article class="item ${done[x.id]?'done':''}"><div class="stripe" style="background:${color(x.course)}"></div><button class="check" onclick="mark(${x.id})">${done[x.id]?'✓':''}</button><div class="content"><div class="date">📅 ${esc(x.display)}</div><span class="title">${esc(x.title)}</span><span class="tag">${esc(x.type)}</span><div class="course">${esc(x.course)}</div>${x.note?`<div class="note">⚠ ${esc(x.note)}</div>`:''}</div><div class="actions"><button class="iconbtn" onclick="openForm(${x.id})" title="Edit">✎</button><button class="iconbtn" onclick="removeEvent(${x.id})" title="Delete">⌫</button></div></article>`).join('');let n=items.filter(x=>done[x.id]).length,p=items.length?Math.round(n/items.length*100):0,next=items.find(x=>!done[x.id]);$('pct').textContent=p+'%';$('ring').style.setProperty('--p',p+'%');$('nextTitle').textContent=next?next.title:'All completed 🎉';$('nextMeta').textContent=next?next.display+' · '+next.course:n+' of '+items.length+' completed'}render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
